services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webgaze
      POSTGRES_USER: webgaze
      POSTGRES_PASSWORD: webgaze
    ports:
      - "5432:5432"
    volumes:
      - webgaze-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgaze -d webgaze"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  webgaze-postgres:
