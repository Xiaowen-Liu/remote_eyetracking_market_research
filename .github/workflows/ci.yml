name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e 'apps/api[dev]'
      - run: npm ci
      - run: .venv/bin/ruff check apps/api
      - run: npm test
      - run: npm run generate:contract
      - name: Verify generated API contract is committed
        run: git diff --exit-code -- packages/api-contract

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webgaze
          POSTGRES_USER: webgaze
          POSTGRES_PASSWORD: webgaze
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webgaze -d webgaze"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e 'apps/api[dev]'
      - name: Apply, reverse, and reapply migration
        working-directory: apps/api
        run: |
          ../../.venv/bin/alembic -c alembic.ini upgrade head
          ../../.venv/bin/alembic -c alembic.ini downgrade base
          ../../.venv/bin/alembic -c alembic.ini upgrade head
